<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="claw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7CD93E" />
            <stop offset="50%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
        <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
        </filter>
    </defs>
    <g transform="translate(10, 15)" filter="url(#glow)">
        <!-- Claw 1 (Leftmost) -->
        <path d="M 10,75 C 12,50 28,33 50,28 C 38,40 22,58 10,75 Z" fill="url(#claw-grad)" />
        <!-- Claw 2 (Middle) -->
        <path d="M 38,68 C 40,43 56,26 78,21 C 66,33 50,51 38,68 Z" fill="url(#claw-grad)" />
        <!-- Claw 3 (Rightmost) -->
        <path d="M 66,61 C 68,36 84,19 106,14 C 94,26 78,44 66,61 Z" fill="url(#claw-grad)" />
    </g>
</svg>
